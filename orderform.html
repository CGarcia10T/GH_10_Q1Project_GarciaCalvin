<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css">
        <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css" integrity="sha384-ggOyR0iXCbMQv3Xipma34MD+dH/1fQ784/j6cY/iJTQUOhcWr7x9JvoRxT2MZw1T" crossorigin="anonymous">

        <!-- Google Font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Google+Sans+Code:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">

        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css">

        <link rel="stylesheet" href="style.css">

        <title>The Cornerstore</title>
    </head>
<body>
    <py-script src="main.py"></py-script>

    <nav class="navbar navbar-expand-sm" id="navbar">
        <div class="container-fluid">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" href="index.html" id="link">Homepage</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="contact.html" id="link">Contact Us</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="orderform.html" id="link">Order Form</a>
                </li>
            </ul>
        </div>
    </nav>

    <div class="container" id="order-header">
        <h1>Food Ordering System</h1>
    </div>

    <div class="container" id="order-body">
        <div class="row">
            <div class="col-md-6">
                <div class="container" id="menu-section">
                    <h4>Menu:</h4>
                    <br>
                    <form>
                        <div>
                            <img src="photos/1.png" id="menu-image">
                            <input type="checkbox" data-price="499.99" id="item-cheese-pizza">
                            <label for="item-cheese-pizza">Four Cheese Pizza - 499.99</label>
                        </div>
                        <br>
                        <div>
                            <img src="photos/2.png" id="menu-image">
                            <input type="checkbox" data-price="399.99" id="item-pepperoni-pizza">
                            <label for="item-pepperoni-pizza">Pepperoni Pizza - 399.99</label>
                        </div>
                        <br>
                        <div>
                            <img src="photos/3.png" id="menu-image">
                            <input type="checkbox" data-price="399.99" id="item-spinach-pizza">
                            <label for="item-spinach-pizza">Spinach Pizza - 399.99</label>
                        </div>
                        <br>
                        <div>
                            <img src="photos/4.png" id="menu-image">
                            <input type="checkbox" data-price="350.99" id="item-carbonara-pasta"> 
                            <label for="item-carbonara-pasta">Carbonara Pasta - 350.99</label>
                        </div>
                        <br>
                        <div>
                            <img src="photos/5.png" id="menu-image">
                            <input type="checkbox" data-price="400.00" id="item-gnocchi">
                            <label for="item-gnocchi">Gnocchi - 400.00</label>
                        </div>
                        <br>
                        <div>
                            <img src="photos/6.png" id="menu-image">
                            <input type="checkbox" data-price="300.00" id="item-lasagna">
                            <label for="item-lasagna">Lasagna - 300.00</label>
                        </div>
                    </form>
                </div>  
            </div>

            <div class="col-md-6" id="customer-details">
                <h4>Customer Details:</h4>
                <br>
                <form>
                    <div class="form-group">
                        <label for="name">Full Name:</label>
                        <input type="text" class="form-control" id="name" placeholder="Enter full name" name="name">
                        <br>
                        <label for="address">Address:</label>
                        <input type="text" class="form-control" id="address" placeholder="Enter address" name="address">
                        <br>    
                        <label for="phone">Phone Number:</label>
                        <input type="number" class="form-control" id="phone" placeholder="Enter phone number" name="phone">
                    </div>
                </form> 
            </div>
        </div>
        <br>
        <button type="button" class="btn animate__animated2" id="order-button" py-click="order_food">Create Order</button>
    </div>

    <div class="container" id="order-summary">
        <h4>Order Summary:</h4>
        <br>
        <div>
            <p id="summary-content">No items ordered yet.</p>
        </div>
    </div>

    <br>
    <button type="button" class="btn animate__animated2" id="order-button" onclick="window.location.href='index.html'">Back to Home</button>

    <div class="container" id="order-footer">
        <p>Open Daily: 10:00 AM - 10:00 PM</p>
        <p><i>© 2025 The Cornerstore. All rights reserved.</i></p>
    </div>

</body>
</html>
